<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ClearPass Policy Visualiser</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        :root {
            --hpe-green: #01A982;
            --dark-bg: #0B111B;
            --dark-card: #151D29;
            --border: #2D3748;
            --text: #E2E8F0;
        }

        body {
            background: var(--dark-bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
        }

        .brand-green {
            color: var(--hpe-green);
        }

        .btn-login {
            background: var(--hpe-green);
            border: none;
            color: #000;
            font-weight: 600;
        }

        .btn-login:hover {
            background: #00c79b;
        }

        .form-control {
            background: #111827;
            border: 1px solid var(--border);
            color: white;
        }

        .form-control:focus {
            background: #111827;
            color: white;
            border-color: var(--hpe-green);
            box-shadow: 0 0 0 .25rem rgba(1,169,130,.25);
        }

    </style>
</head>
<body>

    <div class="login-card">

        <h3 class="mb-3">
            <span class="brand-green">ClearPass</span>
            Policy Visualiser
        </h3>

        <p class="text-secondary">
            Sign in using your ClearPass RADIUS credentials.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'danger' else category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <input
                type="hidden"
                name="next"
                value="{{ next or '' }}">

            <div class="mb-3">
                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="username"
                    required
                    autofocus>
            </div>

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    name="password"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-login w-100">

                Login

            </button>

        </form>

    </div>

</body>
</html>
